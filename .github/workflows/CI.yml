name: Publish

on:
  push:
    tags:
      - "*"

  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  (^_^): &interpreters "3.10 3.11 3.12 3.13 3.14 3.14t 3.15 3.15t pypy3.11"
  ○_○: &interpreters_without_pypy "3.10 3.11 3.12 3.13 3.14 3.14t 3.15 3.15t"
  (o_o): &interpreters_win_arm64 "3.11 3.12 3.13 3.14 3.14t 3.15 3.15t"

jobs:
  tools:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: "zizmor"
            command: zizmor .github/

          - name: "typos"
            command: typos --config typos.toml

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: "Install uv"
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # zizmor: ignore[cache-poisoning]
          enable-cache: ${{ github.event_name == 'pull_request' }}

      - name: "Install ${{ matrix.name }}"
        run: uv pip install --group ${{ matrix.name }} --system

      - name: "Run ${{ matrix.name }}"
        run: ${{ matrix.command }}

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - { target: x86_64-unknown-linux-gnu, arch: x86_64, interpreter: *interpreters }
          - { target: i686-unknown-linux-gnu, arch: x86, interpreter: *interpreters }
          - { target: aarch64-unknown-linux-gnu, arch: aarch64, interpreter: *interpreters }
          - { target: armv7-unknown-linux-gnueabihf, arch: armv7, interpreter: *interpreters }
          - { target: s390x-unknown-linux-gnu, arch: s390x, interpreter: *interpreters }
          - { target: powerpc64le-unknown-linux-gnu, arch: ppc64le, interpreter: *interpreters }
          - { target: riscv64gc-unknown-linux-gnu, arch: riscv64, interpreter: *interpreters }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          activate-environment: true
          enable-cache: false
          python-version: "3"

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        # zizmor: ignore[cache-poisoning]
        with:
          target: ${{ matrix.platform.target }}
          sccache: ${{ github.ref_type != 'tag' }}
          manylinux: auto
          args: >-
            --release
            --out dist
            --interpreter ${{ matrix.platform.interpreter }}
            --compatibility pypi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-linux-${{ matrix.platform.arch }}
          path: dist

  build-musllinux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - { target: x86_64-unknown-linux-musl, arch: x86_64, interpreter: *interpreters }
          - { target: i686-unknown-linux-musl, arch: x86, interpreter: *interpreters }
          - { target: aarch64-unknown-linux-musl, arch: aarch64, interpreter: *interpreters }
          - { target: armv7-unknown-linux-musleabihf, arch: armv7, interpreter: *interpreters }
          - { target: riscv64gc-unknown-linux-musl, arch: riscv64, interpreter: *interpreters }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          activate-environment: true
          enable-cache: false
          python-version: "3"

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        # zizmor: ignore[cache-poisoning]
        with:
          target: ${{ matrix.platform.target }}
          sccache: ${{ github.ref_type != 'tag' }}
          manylinux: musllinux_1_2
          args: >-
            --release
            --out dist
            --interpreter ${{ matrix.platform.interpreter }}
            --compatibility pypi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-musllinux-${{ matrix.platform.arch }}
          path: dist

  build-windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - { runner: windows-latest, target: x64, arch: x64, interpreter: *interpreters }
          - { runner: windows-latest, target: x86, arch: x86, interpreter: *interpreters_without_pypy }
          - { runner: windows-11-arm, target: aarch64, arch: arm64, interpreter: *interpreters_win_arm64 }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          architecture: ${{ matrix.platform.arch }}

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        # zizmor: ignore[cache-poisoning]
        with:
          target: ${{ matrix.platform.target }}
          sccache: ${{ github.ref_type != 'tag' }}
          args: >-
            --release
            --out dist
            --interpreter ${{ matrix.platform.interpreter }}
            --compatibility pypi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        platform:
          - { target: x86_64, interpreter: *interpreters }
          - { target: aarch64, interpreter: *interpreters }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        # zizmor: ignore[cache-poisoning]
        with:
          target: ${{ matrix.platform.target }}
          sccache: ${{ github.ref_type != 'tag' }}
          args: >-
            --release
            --out dist
            --interpreter ${{ matrix.platform.interpreter }}
            --compatibility pypi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: dist

  release:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs:
      - build-linux
      - build-musllinux
      - build-windows
      - build-macos
      - build-sdist

    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        if: github.ref_type == 'tag'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
