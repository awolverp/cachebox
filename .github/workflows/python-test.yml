name: Python Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  HANG_TIMEOUT_SEC: 200

jobs:
  test-python:
    name: ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ endsWith(matrix.python-version, 't') }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.14t"
          - "3.15"
          - "3.15t"
          - "pypy3.11"

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@nightly

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - run: pip install virtualenv
      - run: pip install -r requirements-dev.txt
      - run: virtualenv --no-vcs-ignore .venv
      - run: pip install py-spy
        shell: bash

      - run: maturin develop --features use-small-offset
      - name: pytest (default features)
        shell: bash
        run: |
          chmod +x ./ci_hang_debug.sh
          TIMEOUT_SEC=${{ env.HANG_TIMEOUT_SEC }} ./ci_hang_debug.sh -v
        env:
          HYPOTHESIS_PROFILE: slow
      - name: Upload hang debug artifacts (default features)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hang-debug-${{ matrix.python-version }}-default
          path: hang_artifacts/
          retention-days: 7
          if-no-files-found: ignore

      # Test with nightly feature
      - run: maturin develop --features use-small-offset,nightly
      - name: pytest (nightly feature)
        shell: bash
        run: |
          chmod +x ./ci_hang_debug.sh
          TIMEOUT_SEC=${{ env.HANG_TIMEOUT_SEC }} ./ci_hang_debug.sh -v
        env:
          HYPOTHESIS_PROFILE: slow
      - name: Upload hang debug artifacts (nightly feature)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hang-debug-${{ matrix.python-version }}-nightly
          path: hang_artifacts/
          retention-days: 7
          if-no-files-found: ignore

  test-os-nightly:
    name: ${{ matrix.os }} (rust nightly)
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@nightly

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - run: pip install virtualenv
      - run: pip install -r requirements-dev.txt
      - run: virtualenv --no-vcs-ignore .venv

      - run: maturin develop --features use-small-offset,nightly
      - run: pytest -v -n auto
        env:
          HYPOTHESIS_PROFILE: slow

  test-os-stable:
    name: ${{ matrix.os }} (rust stable)
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - run: pip install virtualenv
      - run: pip install -r requirements-dev.txt
      - run: virtualenv --no-vcs-ignore .venv

      - run: maturin develop --features use-small-offset
      - run: pytest -v -n auto
        env:
          HYPOTHESIS_PROFILE: slow
