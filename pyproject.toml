[build-system]
requires = ["maturin>=1.14.1,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "cachebox._core"

[project]
name = "cachebox"
requires-python = ">=3.9"
keywords = ["caching", "cached", "cachebox", "cache", "in-memory-caching", "memoizing"]
authors = [
    { name = "awolverp", email = "awolverp@gmail.com" }
]

classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: Implementation :: CPython",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries",
    "Development Status :: 5 - Production/Stable",
]

dynamic = [
    "description",
    "license",
    "readme",
    "version"
]

[project.urls]
Homepage = "https://github.com/awolverp/cachebox"
Repository = "https://github.com/awolverp/cachebox"
Issues = "https://github.com/awolverp/cachebox/issues"

[tool.mypy]
disable_error_code = "attr-defined, type-arg, no-untyped-def, no-any-return"
